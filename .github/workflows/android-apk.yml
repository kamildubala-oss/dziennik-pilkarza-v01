name: Android APK (ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'design/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-apk.yml'
      - '.github/scripts/generate_android_icons.py'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze Dart (zero warnings)
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos | tee /tmp/flutter-analyze.log
          python3 - <<'PY'
          import pathlib, re
          output = pathlib.Path('/tmp/flutter-analyze.log').read_text()
          warnings = re.findall(r'^\s*warning\s+[•-]', output, re.MULTILINE)
          print(f'Analyzer warnings: {len(warnings)} (required: 0)')
          if warnings:
              raise SystemExit('Sprint 2 requires zero analyzer warnings')
          PY

      - name: Generate launcher icons from selected artwork
        run: |
          python3 -m venv .icon-venv
          .icon-venv/bin/pip install Pillow
          .icon-venv/bin/python .github/scripts/generate_android_icons.py

      - name: Build obfuscated ARM64 release APK (debug-signed)
        run: |
          flutter build apk --release --target-platform android-arm64 --split-per-abi --obfuscate --split-debug-info=build/symbols --build-number=${{ github.run_number }}

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: dziennik-pilkarza-arm64-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: dziennik-pilkarza-symbols-${{ github.run_number }}
          path: build/symbols/
          if-no-files-found: error
          retention-days: 30
